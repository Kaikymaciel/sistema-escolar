<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico Escolar - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela de Login -->
  <div id="login-screen" class="screen active">
    <h2>Login Administrador</h2>
    <form id="login-form">
      <input type="text" id="username" placeholder="Usuário" required>
      <input type="password" id="password" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <!-- Tela Principal -->
  <div id="main-screen" class="screen">
    <h2>Painel do Administrador</h2>

    <!-- Formulário para adicionar aluno -->
    <section>
      <h3>Armazenar informações do aluno</h3>
      <form id="student-form">
        <input type="text" id="student-name" placeholder="Nome do Aluno" required>
        <input type="text" id="student-course" placeholder="x" required>
        <input type="text" id="student-course" placeholder="x" required>
        <input type="text" id="student-course" placeholder="x" required>
        <input type="text" id="student-course" placeholder="x" required>
        <input type="text" id="student-course" placeholder="x" required>
        <input type="text" id="student-course" placeholder="x" required>
        <input type="text" id="student-course" placeholder="x" required>   
        <input type="number" id="student-year" placeholder="Ano de Ingresso" required>
        <button type="submit">Salvar</button>
      </form>
    </section>

    <!-- Solicitar histórico -->
    <section>
      <h3>Solicitar Histórico</h3>
      <input type="text" id="search-student" placeholder="Digite o nome do aluno">
      <button id="search-btn">Buscar</button>
      <div id="search-result"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
